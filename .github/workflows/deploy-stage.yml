name: Deploy Stage

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch, tag, or SHA) to deploy
        required: true
        default: main

env:
  DEPLOY_REF: ${{ inputs.ref }}

jobs:
  lint_build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: actions/setup-node@v5
        with:
          always-auth: true
          cache: yarn
          node-version: 21

      - name: Install yarn packages
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

  stage_release:
    needs:
      - lint_build_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_REF }}
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      - uses: akhileshns/heroku-deploy@v3.14.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME_STAGE }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
